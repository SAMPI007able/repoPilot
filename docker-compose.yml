services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testforge
      POSTGRES_USER: testforge
      POSTGRES_PASSWORD: testforge-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testforge"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  db-migrate:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: testforge-local
    command:
      - sh
      - -ec
      - 'for migration in /migrations/[0-9][0-9][0-9]_*.sql; do case "$$migration" in *.down.sql) continue;; esac; psql -h postgres -U testforge -d testforge -v ON_ERROR_STOP=1 -f "$$migration"; done'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    restart: "no"

  artifact-init:
    image: alpine:3.21
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /artifacts && chmod -R g+rwX /artifacts && chmod 2770 /artifacts"]
    volumes:
      - preview-artifacts:/artifacts
    restart: "no"

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment: &backend-environment
      DATABASE_URL: postgresql://testforge:testforge-local@postgres:5432/testforge
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_STORE: local
      ARTIFACT_LOCAL_ROOT: /app/workspace/artifacts
      RUNTIME_MANIFEST_AI_FALLBACK: "false"
      PREVIEW_TRUSTED_LOCAL_EXECUTION: "true"
      PREVIEW_PUBLIC_HOST: 127.0.0.1
      PREVIEW_HEALTH_HOST: host.docker.internal
      AUTH_MODE: oidc
      OAUTH_CALLBACK_BASE_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://127.0.0.1:5173
    depends_on:
      artifact-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - preview-artifacts:/app/workspace/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  preview-worker:
    build: ./backend
    command: ["sh", "-c", "umask 0002 && exec rq worker previews --url redis://redis:6379/0"]
    env_file:
      - ./backend/.env
    environment: *backend-environment
    user: root
    group_add:
      - "10001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - preview-artifacts:/app/workspace/artifacts
      - /var/run/docker.sock:/var/run/docker.sock

  preview-reconciler:
    build: ./backend
    command: ["python", "-m", "app.workers.preview_reconciler"]
    env_file:
      - ./backend/.env
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - preview-artifacts:/app/workspace/artifacts

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-oidc}
        VITE_AUTH_DEVELOPMENT_TOKEN: ${VITE_AUTH_DEVELOPMENT_TOKEN:-}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://127.0.0.1:5173/auth/callback}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
        VITE_OIDC_CONNECTION_PARAMETER: ${VITE_OIDC_CONNECTION_PARAMETER:-connection}
        VITE_OIDC_GITHUB_CONNECTION: ${VITE_OIDC_GITHUB_CONNECTION:-github}
        VITE_OIDC_GOOGLE_CONNECTION: ${VITE_OIDC_GOOGLE_CONNECTION:-google-oauth2}
        VITE_OIDC_EMAIL_CONNECTION: ${VITE_OIDC_EMAIL_CONNECTION:-Username-Password-Authentication}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres-data:
  redis-data:
  preview-artifacts:
